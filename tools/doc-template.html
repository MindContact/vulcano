<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
  :root{
    --ink:#1a2332; --muted:#5b6472; --line:#e2e6ec; --brand:#b8380f;
    --brand-soft:#fdeee6; --accent:#0a7d55; --warn:#8a5a00; --warn-soft:#fdf4e3;
    --bg:#ffffff; --zebra:#f7f9fc;
  }
  *{box-sizing:border-box;}
  html{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); line-height:1.6; margin:0; background:#eef1f5; font-size:15px;}
  .page{max-width:880px; margin:32px auto; background:var(--bg); padding:56px 64px; box-shadow:0 2px 24px rgba(20,30,50,.10); border-radius:8px;}
  header.cover{border-bottom:4px solid var(--brand); padding-bottom:24px; margin-bottom:32px;}
  header.cover .eyebrow{color:var(--brand); font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:12px;}
  h1{font-size:28px; line-height:1.25; margin:8px 0 16px; color:var(--ink);}
  h2{font-size:20px; margin:38px 0 12px; color:var(--brand); border-bottom:1px solid var(--line); padding-bottom:6px;}
  h3{font-size:16px; margin:24px 0 8px; color:var(--ink);}
  p{margin:8px 0;}
  .meta{display:grid; grid-template-columns:auto 1fr; gap:4px 16px; font-size:14px; color:var(--muted); margin-top:16px;}
  .meta dt{font-weight:600; color:var(--ink);} .meta dd{margin:0;}
  table{width:100%; border-collapse:collapse; margin:16px 0; font-size:14px;}
  th,td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--line);}
  th{background:var(--brand-soft); color:var(--brand); font-weight:700;}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums;}
  tbody tr:nth-child(even){background:var(--zebra);}
  tr.total td{font-weight:800; border-top:2px solid var(--brand); background:#fdf3ee;}
  tr.sub td{font-style:italic; color:var(--muted); background:#f2f6fb;}
  tr.group td{font-weight:700; background:#eef3f9;}
  .tag{display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; letter-spacing:.03em; text-transform:uppercase;}
  .tag.done{background:#e4f4ec; color:var(--accent);}
  .tag.todo{background:var(--warn-soft); color:var(--warn);}
  .tag.up{background:#fde7e7; color:#a11;}
  .tag.down{background:#e4f4ec; color:var(--accent);}
  .callout{background:var(--brand-soft); border-left:4px solid var(--brand); padding:16px 20px; border-radius:0 6px 6px 0; margin:20px 0;}
  .callout.warn{background:var(--warn-soft); border-left-color:var(--warn);}
  .highlight{background:linear-gradient(90deg,#0b4f8a,#0a6fb0); color:#fff; padding:20px 24px; border-radius:8px; margin:20px 0; display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;}
  .highlight .label{font-size:14px; opacity:.9; letter-spacing:.04em; text-transform:uppercase;}
  .highlight .value{font-size:30px; font-weight:800;}
  .kpi-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:20px 0;}
  .kpi{border:1px solid var(--line); border-radius:8px; padding:16px; text-align:center; background:var(--zebra);}
  .kpi .n{font-size:24px; font-weight:800; color:var(--brand); font-variant-numeric:tabular-nums;}
  .kpi .l{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:4px;}
  .muted{color:var(--muted);} small{color:var(--muted);}
  ul{margin:8px 0; padding-left:22px;} li{margin:4px 0;}
  code{background:#f0f2f5; padding:1px 5px; border-radius:4px; font-size:13px;}
  footer{margin-top:40px; padding-top:16px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted); font-style:italic;}
  .range-band{display:grid; grid-template-columns:1fr 1fr 1fr; text-align:center; border:1px solid var(--line); border-radius:8px; overflow:hidden; margin:16px 0;}
  .range-band div{padding:14px;}
  .range-band .c{background:var(--brand); color:#fff;}
  .range-band .n{font-size:20px; font-weight:800; font-variant-numeric:tabular-nums;}
  .range-band .l{font-size:12px; text-transform:uppercase; letter-spacing:.04em;}
  @page{size:A4; margin:14mm 12mm;}
  @media print{body{background:#fff;} .page{box-shadow:none; margin:0; max-width:none; padding:24px 8px; border-radius:0;} h2{page-break-after:avoid;} table{page-break-inside:avoid;}}
  @media (max-width:640px){.page{padding:28px 20px;} .kpi-grid,.range-band{grid-template-columns:1fr;}}
</style>
</head>
<body><div class="page"></div></body>
</html>
